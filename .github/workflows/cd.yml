name: CD

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

  push:
    branches:
      - main

  workflow_dispatch:

permissions: 
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Incrementar versión
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          VERSION=$(grep -o 'AppVersion-[0-9]*' README.md | head -1 | grep -o '[0-9]*')
          NEW_VERSION=$((VERSION + 1))
          DATE=$(date '+%Y-%m-%d %H:%M:%S')
          sed -i "s/AppVersion-$VERSION/AppVersion-$NEW_VERSION - $DATE/" README.md

      - name: Commit y push
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Actualizar versión [skip ci]"
          git push

  validate-prod:
    needs: bump-version
    runs-on: self-hosted    
    steps:
      - name: Comparar PROD_TOKEN con LOCAL_PROD_TOKEN
        env:
          SECRET_PROD_TOKEN: ${{ secrets.PROD_TOKEN }}
        run: |
          if [ "$SECRET_PROD_TOKEN" = "$LOCAL_PROD_TOKEN" ]; then
            echo "Los tokens coinciden ✅"  
          else
            echo "Los tokens no coinciden ❌"
            exit 1
          fi

